name: Bug report
description: Report something that is not working as expected
title: "[BUG] "
labels: ["bug"]
assignees:
  - AliSajid
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide, the faster it can be fixed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this bug has not been reported yet
          required: true
        - label: I can reproduce this on the latest release
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: A clear and concise description of the behavior you expected.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The minimal steps that reliably trigger the problem.
      placeholder: |
        1. Go to '…'
        2. Click on '…'
        3. Scroll down to '…'
        4. See error
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      placeholder: "for example: macOS 15.1, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: input
    id: release-version
    attributes:
      label: Release version
      placeholder: "for example: 0.1.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any logs or error output. It is formatted as code automatically, so no backticks are needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots and additional context
      description: Drag and drop screenshots here, and add anything else that might help.
    validations:
      required: false
